<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welkom bij Tensing</title>
<link rel="icon" href="images/logo-tensing.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
  /* zelfde stijl als stad.html: lichte panelen, kleine afronding, groen accent */
  :root { --kaartje:rgba(255,255,255,.92); --tekst:#1F2A37; --sub:#33455C; --merk:#2A6E5A; --merk-licht:#ADCAEB;
          --goed:#2A6E5A; --fout:#C9483F; --lucht:#F4FFED; }
  html, body { margin:0; height:100%; }
  body { font-family:system-ui, sans-serif; color:var(--tekst); background:#2B3226; overflow:hidden; }
  #kaart { position:fixed; inset:0; background:#2B3226; }
  .leaflet-container { cursor:crosshair; font-family:inherit; }
  .leaflet-dragging .leaflet-container { cursor:grabbing; }

  /* welkomstvenster met de opdracht eronder */
  .welkom { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:1000;
            width:min(440px, calc(100vw - 32px)); box-sizing:border-box;
            background:var(--kaartje); border-radius:6px; overflow:hidden;
            -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
            box-shadow:0 12px 34px rgba(10,20,40,.22); }
  .welkom .kop { display:flex; align-items:center; justify-content:center; gap:12px; padding:18px 22px 0; }
  .welkom .kop img { width:20px; height:auto; display:block; }
  .welkom .kop span { font-size:15px; font-weight:600; letter-spacing:.02em; color:var(--merk); }
  .welkom .inhoud { padding:10px 22px 14px; }
  .welkom h1 { font-size:clamp(17px, 1.4vw, 21px); font-weight:500; line-height:1.3; margin:0 0 8px; color:var(--tekst); }
  .welkom .woord { font-size:14px; line-height:1.55; color:var(--sub); margin:0; }
  .welkom .contact { display:flex; align-items:center; gap:12px; margin-top:12px; padding-top:12px;
                     border-top:1px solid #E6E9EE; font-size:13px; line-height:1.45; }
  .welkom .foto { width:40px; height:40px; border-radius:50%; flex:none; background:var(--merk-licht);
                  display:flex; align-items:center; justify-content:center; color:var(--merk); font-weight:600; overflow:hidden; }
  .welkom .foto img { width:100%; height:100%; object-fit:cover; }
  .welkom .contact strong { display:block; font-weight:600; }
  .welkom .contact a { color:var(--merk); text-decoration:none; }
  .welkom .contact a:hover { text-decoration:underline; }
  .welkom .opdracht { background:var(--merk); color:#fff; padding:12px 20px; font-size:15px; font-weight:500;
                      display:flex; align-items:center; gap:10px; }
  .welkom .opdracht::before { content:''; width:9px; height:9px; border-radius:50%; background:var(--merk-licht); flex:none; }
  .welkom .dicht { position:absolute; top:10px; right:10px; width:28px; height:28px; border:none; border-radius:50%;
                   background:transparent; color:var(--sub); font-size:16px; cursor:pointer; }
  .welkom .dicht:hover { background:#EEF1F5; }
  .welkom .pogingen { font-size:14px; color:var(--sub); margin:0; }
  .welkom .pogingen b { color:var(--merk); font-family:'Fredoka', system-ui, sans-serif; font-weight:600; font-size:17px; }
  .welkom .inhoud { padding-bottom:18px; }
  .welkom.klein .kop { padding-bottom:12px; }

  .melding { position:fixed; bottom:34px; left:50%; transform:translate(-50%, 12px); z-index:1000;
             background:var(--kaartje); border-radius:6px; padding:12px 20px; font-size:14px; color:var(--tekst); opacity:0;
             -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); box-shadow:0 12px 34px rgba(10,20,40,.22); transition:opacity .25s ease, transform .25s ease;
             pointer-events:none; max-width:calc(100vw - 48px); box-sizing:border-box; text-align:center; }
  .melding.zichtbaar { opacity:1; transform:translate(-50%, 0); }
  .melding.fout { border-left:4px solid var(--fout); }
  .melding.goed { border-left:4px solid var(--goed); }
  #sluier { position:fixed; inset:0; background:var(--lucht); opacity:0; pointer-events:none; z-index:2000;
            transition:opacity .7s ease; }
  @keyframes schud { 0%,100% { transform:translateX(-50%); } 25% { transform:translateX(calc(-50% - 6px)); } 75% { transform:translateX(calc(-50% + 6px)); } }
  .welkom.schud { animation:schud .3s ease 2; }
  .speld { width:24px; height:24px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff;
           box-shadow:0 3px 8px rgba(0,0,0,.4); transition:opacity .6s ease; box-sizing:border-box; }
  .speld.fout { background:var(--fout); }
  .speld.goed { background:var(--goed); }
  @media (prefers-reduced-motion: reduce) { .welkom.schud { animation:none; } #sluier { transition:none; } }
</style>
</head>
<body>
<div id="kaart" aria-label="Luchtfoto van Nederland"></div>

<!-- OPDRACHT (Beeld 1) -->
<section class="welkom" id="welkom" aria-labelledby="welkomTitel">
  <div class="kop">
    <img src="images/logo-tensing.svg" alt="Tensing">
  </div>
  <div class="inhoud">
    <h1 id="welkomTitel">Wijs ons kantoor aan op de kaart om verder te gaan.</h1>
    <p class="pogingen">Pogingen: <b id="aantal">0</b></p>
  </div>
</section>

<div class="melding" id="melding" role="status" aria-live="polite"></div>
<div id="sluier"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var VOLGENDE = 'stad.html';                         // hierheen na het goede antwoord
var OPSLAG = 'tensing-kantoor-zoeken';              // localStorage: { pogingen, gevonden, datum }
// omtrek van ons kantoor W1 (Winthontlaan 1, Utrecht): BAG-pand 0344100000057551, opgehaald via PDOK
var W1 = [[52.062378,5.108005],[52.062387,5.107972],[52.062389,5.107966],[52.06224,5.107849],[52.062218,5.107833],[52.062196,5.10782],[52.062174,5.10781],[52.062155,5.107803],[52.062166,5.10771],[52.062189,5.107717],[52.062193,5.107717],[52.062196,5.107717],[52.062199,5.107715],[52.062202,5.107712],[52.062205,5.107708],[52.062207,5.107704],[52.062209,5.107699],[52.062209,5.107693],[52.06221,5.107687],[52.062209,5.107682],[52.062209,5.10768],[52.062208,5.107679],[52.062207,5.107674],[52.062204,5.107669],[52.062202,5.107666],[52.062199,5.107663],[52.062195,5.107661],[52.062192,5.107661],[52.062188,5.107662],[52.062185,5.107664],[52.062182,5.107666],[52.062179,5.10767],[52.062177,5.107675],[52.062176,5.10768],[52.062176,5.107682],[52.062171,5.107681],[52.06217,5.107681],[52.062172,5.10766],[52.06218,5.107588],[52.062177,5.107587],[52.062145,5.107578],[52.062113,5.107574],[52.062081,5.107572],[52.062049,5.107575],[52.062017,5.10758],[52.061986,5.107589],[52.061954,5.107601],[52.061934,5.107611],[52.061936,5.107621],[52.061916,5.107632],[52.061914,5.107623],[52.061894,5.107636],[52.061889,5.107639],[52.061865,5.107658],[52.061837,5.107683],[52.06181,5.107711],[52.061784,5.107741],[52.061759,5.107774],[52.061736,5.10781],[52.061714,5.107849],[52.061694,5.107889],[52.061676,5.107932],[52.061659,5.107976],[52.061644,5.108022],[52.061615,5.10812],[52.061634,5.108135],[52.061629,5.108157],[52.061626,5.108178],[52.061623,5.1082],[52.06162,5.108222],[52.061617,5.108244],[52.061615,5.108267],[52.061584,5.108242],[52.06158,5.108239],[52.06156,5.108305],[52.061558,5.108303],[52.061538,5.108368],[52.061541,5.10837],[52.061408,5.108816],[52.061398,5.108849],[52.061396,5.108856],[52.061445,5.108894],[52.061445,5.108894],[52.061437,5.108921],[52.061418,5.108986],[52.061418,5.108986],[52.061498,5.109049],[52.061537,5.108918],[52.061667,5.108483],[52.061687,5.108499],[52.061681,5.108519],[52.061678,5.108517],[52.061678,5.108517],[52.061683,5.108525],[52.061693,5.108543],[52.061695,5.108546],[52.061705,5.108559],[52.061717,5.108572],[52.06173,5.108582],[52.061745,5.10859],[52.061759,5.108595],[52.061774,5.108597],[52.061781,5.108597],[52.061781,5.108597],[52.061778,5.108595],[52.061784,5.108574],[52.061799,5.108586],[52.061781,5.108647],[52.061849,5.1087],[52.061892,5.108554],[52.061905,5.108564],[52.061903,5.10857],[52.061907,5.108574],[52.061907,5.108574],[52.061909,5.108567],[52.061953,5.108602],[52.061952,5.108608],[52.061956,5.108612],[52.061957,5.108605],[52.062001,5.108639],[52.061998,5.108647],[52.062022,5.108666],[52.062022,5.108666],[52.06187,5.109178],[52.061831,5.109309],[52.061911,5.109372],[52.061911,5.109372],[52.061931,5.109307],[52.061939,5.109281],[52.061987,5.109318],[52.061989,5.109312],[52.061983,5.109307],[52.061993,5.109274],[52.061999,5.109279],[52.062027,5.109187],[52.06214,5.108806],[52.062149,5.108774],[52.062152,5.108775],[52.06216,5.108749],[52.062157,5.108747],[52.062171,5.108701],[52.062122,5.108663],[52.062158,5.108545],[52.062206,5.108583],[52.062223,5.108525],[52.062223,5.108524],[52.06224,5.108537],[52.062238,5.108543],[52.062242,5.108546],[52.062386,5.108061],[52.062382,5.108057],[52.06238,5.108063],[52.062364,5.108051],[52.062378,5.108005]];
var W1_SPELD = [52.06158, 5.10836];                 // adrespunt Winthontlaan 1

// luchtfoto zonder labels of plaatsnamen; de kaart begint op het niveau van heel Nederland
var kaart = L.map('kaart', {
  center: [52.4, 5.3], zoom: 8, minZoom: 7, maxZoom: 20,   // iets naar het noorden: Nederland valt onder het welkomstvenster
  maxBounds: [[50.5, 2.8], [53.8, 7.6]], maxBoundsViscosity: 0.8,
  doubleClickZoom: false
});
kaart.zoomControl.setPosition('bottomright');
L.tileLayer('https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg', {
  maxNativeZoom: 19, maxZoom: 20,
  attribution: 'Luchtfoto &copy; <a href="https://www.pdok.nl/">PDOK</a> / Beeldmateriaal Nederland'
}).addTo(kaart);
kaart.attributionControl.setPrefix('');

// aantal pogingen bewaren (ook na herladen); nog niet zichtbaar gebruikt
function leesStand() {
  try { return JSON.parse(localStorage.getItem(OPSLAG)) || { pogingen: 0, gevonden: false }; }
  catch (e) { return { pogingen: 0, gevonden: false }; }
}
function bewaarStand() {
  try { localStorage.setItem(OPSLAG, JSON.stringify(stand)); } catch (e) {}
}
var stand = leesStand();
if (stand.gevonden) stand = { pogingen: 0, gevonden: false };   // nieuwe ronde na een eerdere vondst

var melding = document.getElementById('melding'), welkom = document.getElementById('welkom');
var klaar = false, meldTimer = null;
function meld(html, soort, blijf) {
  melding.innerHTML = html; melding.className = 'melding zichtbaar ' + soort;
  clearTimeout(meldTimer);
  if (!blijf) meldTimer = setTimeout(function () { melding.classList.remove('zichtbaar'); }, 2400);
}
function speld(latlng, soort) {
  return L.marker(latlng, { icon: L.divIcon({ className: '', html: '<div class="speld ' + soort + '"></div>', iconSize: [24, 24], iconAnchor: [12, 30] }),
                            interactive: false, keyboard: false }).addTo(kaart);
}
// raak = binnen de omtrek; pas vanaf straatniveau ook een paar pixels ernaast (anders is uitgezoomd alles "raak")
function binnen(p, poly) {
  var c = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var a = poly[i], b = poly[j];
    if ((a[0] > p[0]) !== (b[0] > p[0]) && p[1] < (b[1] - a[1]) * (p[0] - a[0]) / (b[0] - a[0]) + a[1]) c = !c;
  }
  return c;
}
function opW1(latlng) {
  if (binnen([latlng.lat, latlng.lng], W1)) return true;
  if (kaart.getZoom() < 17) return false;
  var pt = kaart.latLngToLayerPoint(latlng), pts = W1.map(function (q) { return kaart.latLngToLayerPoint(q); });
  for (var i = 0; i < pts.length - 1; i++) if (L.LineUtil.pointToSegmentDistance(pt, pts[i], pts[i + 1]) < 6) return true;
  return false;
}

kaart.on('click', function (e) {
  if (klaar) return;
  stand.pogingen++;
  bewaarStand();
  document.getElementById('aantal').textContent = stand.pogingen;
  if (opW1(e.latlng)) { gevonden(); return; }
  var s = speld(e.latlng, 'fout');
  setTimeout(function () {
    var d = s.getElement() && s.getElement().firstChild;
    if (d) d.style.opacity = 0;
    setTimeout(function () { kaart.removeLayer(s); }, 650);
  }, 1800);
  welkom.classList.remove('schud'); void welkom.offsetWidth; welkom.classList.add('schud');
  meld('Dat is niet ons kantoor.', 'fout');
});

function gevonden() {
  klaar = true;
  stand.gevonden = true; stand.datum = new Date().toISOString();
  bewaarStand();
  L.polygon(W1, { color: '#7CFFB2', weight: 3, fillColor: '#2E7D5B', fillOpacity: 0.35, interactive: false }).addTo(kaart);
  speld(W1_SPELD, 'goed');
  meld('<strong>Gevonden!</strong> Dit is W1, ons kantoor.', 'goed', true);
  kaart.flyToBounds(L.latLngBounds(W1), { padding: [80, 80], duration: 1.2, maxZoom: 19 });
  setTimeout(function () { document.getElementById('sluier').style.opacity = 1; }, 2400);
  setTimeout(function () { location.href = VOLGENDE + '?pogingen=' + stand.pogingen; }, 3150);   // aantal pogingen gaat mee naar het verhaal
}


</script>
</body>
</html>
